[project]
# The release version lives in package.json. Go mode reads the latest tag and
# cannot finish a prepared bump; explicit checks below still validate Go.
type = "node"
branch = "main"

[changelog]
unconventional = "exclude"

[checks]
lint = true
tests = true
lint_command = "make lint"
test_command = "make test"

[[version_files]]
glob = "package.json"
field = "version"

[[artifacts]]
command = "node scripts/sync-package-lock-version.mjs"
files = ["package-lock.json"]

# Python helpers have independent versions, changelogs and PyPI workflows.
[projects.bookmarks]
path = "packaging/python-bookmarks"
tag_prefix = "shinyhub-bookmarks-v"
paths = ["packaging/python-bookmarks", ".github/workflows/publish-bookmarks.yml"]

[projects.agent]
path = "packaging/python-agent"
tag_prefix = "shinyhub-agent-v"
paths = [
  "packaging/python-agent",
  "examples/agent-chat-demo",
  "examples/agent-shiny-demo",
  "examples/agent-charts-demo",
  "scripts/agent-chat-browser-e2e.mjs",
  "scripts/agent-shiny-browser-e2e.mjs",
  "scripts/agent-charts-browser-e2e.mjs",
  "scripts/vendor-agent-charts.py",
  "scripts/namespace-chart-vendor.mjs",
  ".github/workflows/publish-agent.yml",
]
